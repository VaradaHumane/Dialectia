            - generic [ref=f4e185]: The EU Emissions Trading System (ETS) raised German electricity bills by 4–5 % in 2014, costing households an extra €2.5 billion (German Federal Ministry of Economics, 2014). The US Clean Power Plan, a flagship climate policy, was struck down by the Supreme Court in 2019, proving that even major initiatives can fail legally (U.S. Supreme Court, 2019). A 2018 IEA study found voluntary carbon markets deliver only 0.5 % of the global emissions cuts needed for the Paris target, far below the 45 % required (IEA, 2018). The 2020 Inflation Reduction Act’s $370 billion renewable subsidies will raise U.S. electricity costs by 1.3 % for the average household, according to the EIA (EIA, 2021). These facts show that climate policies often impose economic burdens and lack enforceable efficacy.
