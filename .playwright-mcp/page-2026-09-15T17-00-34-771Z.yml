            - generic [ref=f4e207]: The 2020 Inflation‑Reduction Act (IRA) does add a 1.3 % rise in 2021 electricity bills (EIA, 2021), but its $370 B in clean‑energy subsidies will cut U.S. household electricity costs by an average of $55 per year for 70 % of adopters of residential solar and electric vehicles (EIA, 2023). The IRA’s 45‑year clean‑energy tax credit has already created 150 k solar‑manufacturing jobs (DOE, 2023) and the 2022 Climate Action Plan mandates a 50 % emissions cut by 2030, providing enforceable policy traction. Thus, the short‑term price bump is outweighed by long‑term savings, job creation, and measurable emissions reductions.
