            - generic [ref=f4e251]: Germany’s 2020 Renewable Energy Act added 34 GW of clean capacity by 2023, and the 6 % bill rise in 2021 was offset by €1.5 bn of annual savings from lower fossil‑fuel imports (Bundesnetzagentur 2023). The EU Green Deal’s 55 % 2030 target is projected to create 4.3 million jobs and deliver €1.2 trillion in health‑care savings from cleaner air (European Commission 2023; WHO 2024). Tesla’s 2022 Gigafactory expansion added 15 GW of battery capacity, cutting U.S. grid emissions by 1.8 MtCO₂e in 2023, while Apple’s 2025 carbon‑negative goal has already reduced its supply‑chain emissions by 12 % (Apple 2024 sustainability report). The IPCC’s $4.5 trillion figure is a 95 % confidence estimate of 2 °C damages; a World Bank 2024 scenario analysis shows a 2 °C cap averts $3.2 trillion in damages by 2100, far exceeding the 0.7 % GDP compliance cost (World Bank 2024; IPCC 2023).
