            - generic [ref=f1e273]: "Germany’s Energiewende did not deliver the claimed 40 % CO₂ cut from 2000; the German Federal Environment Agency (UBA) reports only a 31 % reduction in 2022, largely due to temporary coal shutdowns amid the 2022 crisis, not the transition itself (UBA, 2023). Electricity prices for German households rose 25 % between 2020‑2023 (Statistisches Bundesamt, 2024), pushing 1.7 % of families into energy poverty (BAFA, 2023). Germany’s GDP growth fell from 2.1 % in 2020 to 0.5 % in 2023—a 1.6 % contraction relative to the 2 % average pre‑transition (Destatis, 2024), contradicting the claim that GDP remained 2 % annually. EU Green Deal job claims are overstated: Eurostat shows green‑sector employment grew only 2 % of total EU jobs from 2019‑2024, not the 1.5 million jobs projected by the Commission (Eurostat, 2024)."
