            - generic [ref=f1e185]: A 2019 OECD analysis found a $50/tonne carbon tax would shrink GDP by 0.5 % in developing countries and 0.2 % in developed ones. The EU’s 2013 Climate Change Act depended on its Emissions Trading System, yet by 2019 the price fell to $4.5/tonne, erasing the incentive for clean investment. In 2018 the Dutch “green tax” on electricity raised household bills by 1.2 %, pushing 3 % more families into energy poverty. A 2021 Institute for Energy Economics and Financial Analysis study warned that a 50 % rise in electricity costs could cut EU GDP by 2.3 %. These facts illustrate that aggressive climate policy often imposes tangible economic harm without delivering commensurate environmental benefits.
