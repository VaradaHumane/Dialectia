              - generic [ref=f1e162]: R1
            - generic [ref=f1e163]: "Aggressive climate policy is an economic imperative: the EU Green Deal (2020) projects €1.2 trillion in investment, creating 1.5 million jobs by 2030 (European Commission). The U.S. Inflation‑Reduction Act (2021) allocates $369 billion to clean energy, with the Congressional Budget Office estimating a 1.5 Gt CO₂ reduction by 2030 and a net savings of $1.1 trillion over 20 years (CBO). China’s 2023 State Council decree to phase out coal by 2030 and reach carbon neutrality by 2060 already mandates a 30 % renewable share of electricity by 2030 (China Energy Statistical Yearbook). In contrast, the IPCC AR6 warns that without such policy, global temperatures could exceed 3 °C by 2100, costing the global economy $2.5 trillion annually (IPCC, 2022). Thus, the short‑term costs are outweighed by long‑term economic and environmental gains."
