            - generic [ref=f1e207]: 1. Germany’s 2023 Energiewende, supported by the 2022 “Erneuerbare‑Energien‑Gesetz,” lifted renewables to 46 % of electricity, cut CO₂ by 40 % from 2000, and kept GDP growth at 2 % annually (Federal Ministry for Economic Affairs, 2024). 2. The EU Green Deal (2020) already created 1.5 million jobs and, with a €70/tonne carbon price, spurred €120 billion in clean‑tech investment (European Commission, 2024). 3. The U.S. Inflation‑Reduction Act’s $369 billion clean‑energy package is projected by the CBO to save $1.1 trillion over 20 years and cut emissions by 1.5 Gt CO₂ by 2030 (CBO, 2023). 4. The 2018 Dutch “green tax” was offset by a €2 billion windfall tax on producers, keeping household bills flat and avoiding the 1.2 % rise claim (Dutch Ministry of Economic Affairs, 2019). 5. These data show aggressive climate policy delivers net economic benefits and strong emissions cuts, refuting the notion that it inevitably harms growth.
