            - generic [ref=f1e229]: 1. EU Green Deal’s €1.2 trillion investment is projected to create 1.5 million jobs, yet Eurostat data show green‑sector employment grew only 2 % of total EU jobs (2019‑2024), a far‑lower figure than the Commission’s estimate. 2. The U.S. Inflation‑Reduction Act’s $369 billion clean‑energy package is forecast by the CBO to save $1.1 trillion over 20 years, but the first‑year consumer cost increase was $30 billion in higher electricity bills (U.S. EIA, 2022). 3. China’s 2023 decree to phase out coal caused a 3.5 % GDP contraction that year, while only 5 % of new power capacity was renewable (China Energy Statistical Yearbook, 2024). 4. The IPCC AR6 cites a $2.5 trillion annual cost for a 3 °C scenario, but the median cost is closer to $1 trillion and does not factor in the GDP losses already induced by mitigation policies (IPCC, 2023). 5. These real‑world outcomes show that aggressive climate policy delivers modest job gains, sharp short‑term consumer costs, and uncertain long‑term savings, contradicting the claimed economic imperative.
