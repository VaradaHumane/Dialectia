            - generic [ref=f1e251]: "The IPCC AR6 WG3 (2022) estimates that a 3 °C world would impose avoided damages of **$2.5 trillion per year**—a figure that represents losses averted by mitigation, not the cost of the policies themselves. Mitigation costs are a tiny share of GDP: a 2024 EU Green Deal cost‑benefit analysis projects **net gains of €3.6 trillion (≈$3.9 trillion) by 2050**, with annual mitigation spending <1 % of EU GDP (European Commission, 2024). The U.S. Inflation‑Reduction Act’s $369 billion clean‑energy package is projected to save **$1.1 trillion over 20 years**, offsetting the **$30 billion first‑year bill rise** (CBO 2023, EIA 2022). Thus, aggressive climate policy delivers net economic benefits that far exceed the avoided damages, refuting the claim that mitigation costs outweigh gains."
