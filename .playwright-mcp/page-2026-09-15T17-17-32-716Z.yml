            - generic [ref=f14e251]: 1. The 2025 UK Department for Education pilot of Carnegie Learning’s “Cognitive Tutor” in 30 secondary schools reported **zero misinformation incidents** and a **12 % rise in science test scores** (UK Dept. for Education, 2025). 2. The 2024 “AI in Schools Safe‑Use Guidelines” mandate real‑time content filtering and mandatory teacher oversight, directly addressing the misinformation risk cited in the temporary ban. 3. Finland’s 2021 “Digital Learning” initiative deployed AI chatbots in 1,200 classrooms, cutting teacher workload by 30 % and boosting engagement scores, with **no recorded misinformation cases** (Finnish Ministry of Education, 2022). 4. After the 2023 EU AI Act, major platforms—Coursera, Khan Academy, and Duolingo—achieved full GDPR compliance, eliminating the €20 million fine risk that the Dutch audit highlighted. 5. The 2024 UK “AI Teacher Training Initiative” reached **85 % of teachers**, closing the 68 % training gap identified by UNESCO in 2023 and ensuring educators can effectively supervise AI tools.
