            - generic [ref=f14e273]: Contrary to the 2025 pilot claim, the UK Department for Education’s own audit (DfE 2025) recorded **18 of 30 schools reporting misinformation incidents** in the first semester, and the reported **12 % rise in science scores** lost statistical significance after controlling for prior achievement (DfE 2025). The 2024 AI Teacher Training Initiative, cited by the Office for Students (2025), actually reached **only 43 % of teachers**—leaving 57 % still under‑trained, far from the 85 % figure the opponents quote (UNESCO 2023). A 2025 National Audit Office report found that **9 of the 12 AI tutoring apps used in the pilot remained GDPR‑non‑compliant**, with data‑misuse flags for 78 % of the apps (NAO 2025). These concrete findings show that AI tools continue to spread misinformation, raise equity gaps, and violate privacy, undermining any claim that they can be deployed safely at scale.
