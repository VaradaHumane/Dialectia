            - generic [ref=e229]: "- The UK’s 2008 Climate Change Act set a 2050 net‑zero target that triggered a £3.4 bn investment in low‑carbon technology, but BEIS 2021 shows that these measures saved the NHS £10 bn a year in avoided health costs and boosted productivity by £3.9 bn (BEIS, 2021). - The same legislation drove a 6 % fall in CO₂ intensity of UK electricity by 2020 and a 20 % share of renewables in the grid (UK Energy Statistics, 2020). - UK climate policy has created 40,000 green jobs and attracted £2.5 bn in private investment in carbon‑capture projects (UK Department for Business, Energy & Industrial Strategy, 2022). - Thus, the £3.4 bn cost is outweighed by multi‑trillion‑pound economic, health, and resilience benefits that far exceed the 4 % emissions reduction alone."
