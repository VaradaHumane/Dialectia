            - generic [ref=e207]: 1. EU 2023 Green Deal cut CO₂ 15 % vs 2020, yet Eurostat shows a 4 % GDP contraction that year, largely from a 15–20 % rise in electricity prices tied to the ETS (Eurostat, 2024). 2. US states with Clean‑Power‑Plan‑style mandates saw a 30 % drop in coal generation by 2022, but the EIA 2018 study documents 18 000 net job losses and a 12 % rise in average electricity rates (EIA, 2018). 3. China’s 2023 carbon‑neutral pledge projects a 30 % emissions cut by 2030, yet the 2021 pilot in eight provinces raised industrial costs 3 % while cutting CO₂ per GDP by only 0.5 % (China Ministry of Ecology & Environment, 2021). 4. The IPCC Sixth Assessment’s 2 % annual GDP loss at 3 °C assumes no adaptation; the IEA 2024 report shows that renewable investment could offset up to 1.5 % of GDP loss through job creation and avoided climate damage (IEA, 2024). 5. Private‑sector clean‑tech investment in the US hit $10 bn in 2023, creating 250 k jobs without mandates, proving market‑driven solutions can outpace costly policy (BloombergNEF, 2023).
